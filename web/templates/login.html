{{define "login"}}<!doctype html>
<html lang="en" data-theme="day">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nurtur — sign in</title>
  <meta name="theme-color" content="#fff8f0">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="/static/img/pip-face.svg">
  <script nonce="{{.Nonce}}">
    (function () {
      try {
        var mode = localStorage.getItem("nurtur.theme") || "auto";
        var hour = new Date().getHours();
        var auto = (hour >= 21 || hour < 7) ? "night" : "day";
        var theme = (mode === "day" || mode === "night") ? mode : auto;
        document.documentElement.dataset.theme = theme;
      } catch (e) {}
    })();
  </script>
  <link rel="preload" href="/static/fonts/fredoka-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/nunito-sans-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="auth-body">
  <main class="auth-card">
    <span class="pip auth-pip">{{pip "awake"}}</span>
    <h1 class="auth-title">Nurtur</h1>
    <p class="auth-copy">Enter the passcode to see today.</p>
    <form class="auth-form" method="post" action="/login">
      <input type="hidden" name="next" value="{{.Next}}">
      <label class="field">
        <span class="field-label">Passcode</span>
        <input type="password" name="passcode" autocomplete="current-password" inputmode="text" required autofocus>
      </label>
      {{if .LoginError}}<p class="field-error" role="alert">{{.LoginError}}</p>{{end}}
      <button type="submit" class="btn btn-primary auth-submit">{{icon "lock"}}<span>Unlock</span></button>
    </form>
  </main>
</body>
</html>{{end}}
