{{define "timer"}}
<div id="timer-card" class="timer-card {{if .Active}}is-nursing{{else}}is-idle{{end}}"{{if .TimerOOB}} hx-swap-oob="outerHTML"{{end}}{{with .Active}} data-feed-id="{{.ID}}" data-side="{{.Side}}" data-started-at="{{iso .StartedAt}}" data-server-now="{{iso .ServerNow}}"{{end}}>
  {{if .Active}}
    <div class="timer-display">
      <span class="timer-pip">{{pip "nursing"}}</span>
      <div class="timer-copy">
        <p class="timer-label">Nursing <strong>{{.Active.SideTitle}}</strong></p>
        <p class="timer-digits" data-timer-digits>{{timer .Active.Elapsed}}</p>
        <p class="timer-split">{{.Active.SplitLabel}} this feed</p>
        <span class="sr-only" id="timer-announcer" aria-live="polite"></span>
      </div>
      <a class="icon-btn timer-adjust" href="/feeds/{{.Active.ID}}/edit" hx-get="/feeds/{{.Active.ID}}/edit" hx-target="#feed-edit-dialog" hx-swap="innerHTML" aria-label="Adjust this feed">{{icon "pencil"}}</a>
    </div>
  {{else}}
    <p class="timer-idle-hint">Tap a side to start.</p>
  {{end}}

  <p class="timer-cached" data-cached-timer hidden></p>
  <p class="timer-offline" data-offline-hint hidden>Offline — timer still running</p>

  {{if .Active}}
    <div class="timer-actions timer-actions-active">
      <form method="post" action="/feeds/{{.Active.ID}}/switch" hx-post="/feeds/{{.Active.ID}}/switch" hx-target="#timer-card" hx-swap="outerHTML" hx-disabled-elt="find button[type='submit']">
        <input type="hidden" name="side" value="{{.Active.Opposite}}">
        <button type="submit" class="btn btn-switch">{{icon (printf "drop-%s" .Active.Opposite)}}<span>Switch to {{.Active.OppositeTitle}}</span></button>
      </form>
      <form method="post" action="/feeds/{{.Active.ID}}/stop" hx-post="/feeds/{{.Active.ID}}/stop" hx-target="#timer-card" hx-swap="outerHTML" hx-disabled-elt="find button[type='submit']">
        <button type="submit" class="btn btn-done">{{icon "check"}}<span>Done</span></button>
      </form>
    </div>
  {{else}}
    <div class="timer-actions timer-actions-idle">
      <form method="post" action="/feeds" hx-post="/feeds" hx-target="#timer-card" hx-swap="outerHTML" hx-disabled-elt="find button[type='submit']">
        <input type="hidden" name="side" value="left">
        <button type="submit" class="btn btn-side btn-left">{{icon "drop-left"}}<span>Left</span></button>
      </form>
      <form method="post" action="/feeds" hx-post="/feeds" hx-target="#timer-card" hx-swap="outerHTML" hx-disabled-elt="find button[type='submit']">
        <input type="hidden" name="side" value="right">
        <button type="submit" class="btn btn-side btn-right">{{icon "drop-right"}}<span>Right</span></button>
      </form>
    </div>
  {{end}}
</div>
{{end}}
