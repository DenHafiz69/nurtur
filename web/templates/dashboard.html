{{define "dashboard"}}
<section class="summary-section" aria-labelledby="summary-heading">
  <h2 id="summary-heading" class="sr-only">At a glance</h2>
  <div id="status-strip" class="status-strip">{{template "status-cards" .}}</div>
</section>

<section class="today" aria-labelledby="today-heading">
  <div class="today-head">
    <h2 id="today-heading" class="today-title">Today</h2>
    <p class="today-date">{{.TodayLabel}}</p>
  </div>
  <nav class="today-nav" aria-label="History and settings">
    <a class="text-link" href="/timeline">{{icon "history"}}<span>History</span></a>
    <a class="text-link" href="/settings">{{icon "settings"}}<span>Settings</span></a>
  </nav>
  {{template "timeline-today" .}}
</section>
{{end}}
