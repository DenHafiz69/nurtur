name: nurtur

services:
  app:
    build:
      context: .
    image: nurtur:local
    ports:
      - "8005:8080"
    environment:
      # Local-only by default so this runs without Turso credentials.
      # To sync to Turso Cloud, set NURTUR_LOCAL_ONLY=false and provide both
      # TURSO_DATABASE_URL and TURSO_AUTH_TOKEN.
      NURTUR_LOCAL_ONLY: "${NURTUR_LOCAL_ONLY:-true}"
      NURTUR_TZ: "${NURTUR_TZ:-Asia/Kuala_Lumpur}"
      NURTUR_BABY_NAME: "${NURTUR_BABY_NAME:-}"
      NURTUR_NIGHT_START: "${NURTUR_NIGHT_START:-19:00}"
      NURTUR_NIGHT_END: "${NURTUR_NIGHT_END:-07:00}"
      TURSO_DATABASE_URL: "${TURSO_DATABASE_URL:-}"
      TURSO_AUTH_TOKEN: "${TURSO_AUTH_TOKEN:-}"
      # Local writes push within a few seconds; the pull only reconciles
      # out-of-band cloud changes, so five minutes is plenty for one server.
      NURTUR_SYNC_INTERVAL: "${NURTUR_SYNC_INTERVAL:-5m}"
      NURTUR_PASSCODE: "${NURTUR_PASSCODE:-}"
      NURTUR_SIGNUP_KEY: "${NURTUR_SIGNUP_KEY:-}"
      NURTUR_SESSION_SECRET: "${NURTUR_SESSION_SECRET:-}"
      NURTUR_COOKIE_SECURE: "${NURTUR_COOKIE_SECURE:-false}"
      # Admin screen at /admin; disabled (404) when the password is empty.
      NURTUR_ADMIN_PASSWORD: "${NURTUR_ADMIN_PASSWORD:-}"
      # Public origin used in generated invite links.
      NURTUR_PUBLIC_URL: "${NURTUR_PUBLIC_URL:-}"
    volumes:
      - nurtur-data:/data
    restart: unless-stopped
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  nurtur-data:
